name: P3.10 dev24 source patch

on:
  push:
    branches: [phase3/p3.10-production-terrain-replacement]
    paths:
      - '.github/workflows/p3-10-dev24-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase3/p3.10-production-terrain-replacement
      - name: Apply frozen A-0191 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Version.
          replace('gradle.properties', 'mod_version=0.3.0-phase3-dev15', 'mod_version=0.3.0-phase3-dev24')

          # Production-coordinate/color emission: remove comparison-only transforms.
          p = Path('src/client/java/dev/obsidian/render/terrain/RepeatAwareGreedyMesh.java')
          text = p.read_text()
          text = text.replace('P3.4 dev11 pure hybrid comparison mesh.', 'P3.10 dev24 production-coordinate hybrid terrain mesh.')
          old = '''        float offsetX = 0.0f;\n        float offsetY = 0.0f;\n        float offsetZ = 0.0f;\n        int directionOrdinal = baked.direction(sourceQuad);\n        if (directionOrdinal >= 0 && directionOrdinal < DIRECTIONS.length) {\n            Direction direction = DIRECTIONS[directionOrdinal];\n            offsetX = direction.getStepX() * BakedSectionMesh.COMPARISON_FACE_OFFSET;\n            offsetY = direction.getStepY() * BakedSectionMesh.COMPARISON_FACE_OFFSET;\n            offsetZ = direction.getStepZ() * BakedSectionMesh.COMPARISON_FACE_OFFSET;\n        }\n        for (int vertex = 0; vertex < VERTICES_PER_QUAD; vertex++) {\n            out.putFloat(baked.position(sourceQuad, vertex, 0) + offsetX);\n            out.putFloat(baked.position(sourceQuad, vertex, 1) + offsetY);\n            out.putFloat(baked.position(sourceQuad, vertex, 2) + offsetZ);\n            putComparisonColor(out, baked.exactArgbColor(sourceQuad, vertex));'''
          new = '''        for (int vertex = 0; vertex < VERTICES_PER_QUAD; vertex++) {\n            out.putFloat(baked.position(sourceQuad, vertex, 0));\n            out.putFloat(baked.position(sourceQuad, vertex, 1));\n            out.putFloat(baked.position(sourceQuad, vertex, 2));\n            putExactColor(out, baked.exactArgbColor(sourceQuad, vertex));'''
          if old not in text: raise SystemExit('missing passthrough comparison emission anchor')
          text = text.replace(old, new, 1)
          text = text.replace('putComparisonColor(out, baked.exactArgbColor(representative, vertex));',
                              'putExactColor(out, baked.exactArgbColor(representative, vertex));', 1)
          text = text.replace('fixed = plane - BakedSectionMesh.COMPARISON_FACE_OFFSET;', 'fixed = plane;', 3)
          text = text.replace('fixed = plane + 1.0f + BakedSectionMesh.COMPARISON_FACE_OFFSET;', 'fixed = plane + 1.0f;', 3)
          old = '''    private static void putComparisonColor(ByteBuffer out, int argb) {\n        int a = (argb >>> 24) & 0xFF;\n        int r = ((argb >>> 16) & 0xFF) * BakedSectionMesh.COMPARISON_COLOR_NUMERATOR\n                / BakedSectionMesh.COMPARISON_COLOR_DENOMINATOR;\n        int g = ((argb >>> 8) & 0xFF) * BakedSectionMesh.COMPARISON_COLOR_NUMERATOR\n                / BakedSectionMesh.COMPARISON_COLOR_DENOMINATOR;\n        int b = (argb & 0xFF) * BakedSectionMesh.COMPARISON_COLOR_NUMERATOR\n                / BakedSectionMesh.COMPARISON_COLOR_DENOMINATOR;\n        out.put((byte) r);\n        out.put((byte) g);\n        out.put((byte) b);\n        out.put((byte) a);\n    }'''
          new = '''    private static void putExactColor(ByteBuffer out, int argb) {\n        out.put((byte) ((argb >>> 16) & 0xFF));\n        out.put((byte) ((argb >>> 8) & 0xFF));\n        out.put((byte) (argb & 0xFF));\n        out.put((byte) ((argb >>> 24) & 0xFF));\n    }'''
          if old not in text: raise SystemExit('missing comparison color anchor')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Worker-backed record: uploads remain, comparison draws stop, same-pass production encoding is exposed.
          p = Path('src/client/java/dev/obsidian/render/terrain/WorkerBackedSectionLifecycleProbe.java')
          text = p.read_text()
          text = text.replace('                submitDraw(renderer);', '                captureTransformEvidence(renderer);', 1)
          text = text.replace('            encodeLiveDraw(encoder, renderer);', '            captureTransformEvidence(renderer);', 1)
          text = text.replace('"Obsidian Phase 3 dev11 passthrough SOLID"', '"Obsidian Phase 3 dev24 production passthrough SOLID"')
          text = text.replace('"Obsidian Phase 3 dev11 passthrough CUTOUT"', '"Obsidian Phase 3 dev24 production passthrough CUTOUT"')
          text = text.replace('"Obsidian Phase 3 dev11 merged SOLID"', '"Obsidian Phase 3 dev24 production merged SOLID"')
          text = text.replace('"Obsidian Phase 3 dev11 merged CUTOUT"', '"Obsidian Phase 3 dev24 production merged CUTOUT"')
          text = text.replace('RenderPipelines.SOLID_BLOCK, depthTemplate, false);', 'RenderPipelines.SOLID_BLOCK, RenderPipelines.SOLID_TERRAIN, false);', 2)
          text = text.replace('RenderPipelines.CUTOUT_BLOCK, depthTemplate, true);', 'RenderPipelines.CUTOUT_BLOCK, RenderPipelines.CUTOUT_TERRAIN, true);', 2)
          text = text.replace('        RenderPipeline depthTemplate = RenderPipelines.DEBUG_QUADS;\n', '')
          text = text.replace('.withColorTargetState(template.getColorTargetState())\n                .withDepthStencilState(depthTemplate.getDepthStencilState())',
                              '.withColorTargetState(depthTemplate.getColorTargetState())\n                .withDepthStencilState(depthTemplate.getDepthStencilState())', 1)

          insert_anchor = '''    private void submitDraw(GameRenderer renderer) {\n        CommandEncoder encoder = device.createCommandEncoder();\n        encodeLiveDraw(encoder, renderer);\n        encoder.submit();\n        usefulSubmissions++;\n        drawSubmissions++;\n        indirectCalls += INDIRECT_COMMAND_COUNT;\n        triangles += drawableMesh.indexBytes() / Integer.BYTES / 3L;\n    }\n\n'''
          addition = '''    private void captureTransformEvidence(GameRenderer renderer) {\n        if (firstTransformCaptured) return;\n        CameraRenderState camera = renderer.gameRenderState().levelRenderState.cameraRenderState;\n        if (camera == null || camera.pos == null || camera.viewRotationMatrix == null) {\n            throw new IllegalStateException("Minecraft world camera render state is unavailable");\n        }\n        double relativeX = requestedSectionX * (double) SectionSnapshot.INTERIOR_SIZE - camera.pos.x;\n        double relativeY = requestedSectionY * (double) SectionSnapshot.INTERIOR_SIZE - camera.pos.y;\n        double relativeZ = requestedSectionZ * (double) SectionSnapshot.INTERIOR_SIZE - camera.pos.z;\n        if (!Double.isFinite(relativeX) || !Double.isFinite(relativeY) || !Double.isFinite(relativeZ)) {\n            throw new IllegalStateException("Non-finite Phase 3 dev24 camera-relative section origin");\n        }\n        firstTransformCaptured = true;\n        firstCameraX = camera.pos.x;\n        firstCameraY = camera.pos.y;\n        firstCameraZ = camera.pos.z;\n        firstRelativeX = relativeX;\n        firstRelativeY = relativeY;\n        firstRelativeZ = relativeZ;\n    }\n\n    public boolean canClaimProductionReplacement(boolean cutout, long expectedGeneration, long expectedResourceEpoch) {\n        RenderSystem.assertOnRenderThread();\n        if (state != State.LIVE || generation != expectedGeneration || !initialSubmissionCompleted\n                || !pipelineValid || drawableMesh == null || bakedSnapshot == null\n                || differentialCorrectnessProof == null || !differentialCorrectnessProof.exact()\n                || indirectCommands == null || expectedResourceEpoch != bakedSnapshot.resourceEpoch()\n                || SectionMaterialSnapshot.currentResourceEpoch() != expectedResourceEpoch) {\n            return false;\n        }\n        return cutout ? drawableMesh.hybridCutoutQuads() > 0 : drawableMesh.hybridSolidQuads() > 0;\n    }\n\n    public void encodeProductionReplacement(RenderPass pass, GameRenderer renderer, boolean cutout) {\n        RenderSystem.assertOnRenderThread();\n        long epoch = SectionMaterialSnapshot.currentResourceEpoch();\n        if (!canClaimProductionReplacement(cutout, generation, epoch)) {\n            throw new IllegalStateException("P3.10 production replacement record is not claimable");\n        }\n        captureTransformEvidence(renderer);\n        CameraRenderState camera = renderer.gameRenderState().levelRenderState.cameraRenderState;\n        double relativeX = drawableMesh.originX() - camera.pos.x;\n        double relativeY = drawableMesh.originY() - camera.pos.y;\n        double relativeZ = drawableMesh.originZ() - camera.pos.z;\n        Matrix4f modelView = new Matrix4f(camera.viewRotationMatrix)\n                .translate((float) relativeX, (float) relativeY, (float) relativeZ);\n        GpuBufferSlice dynamicTransforms = RenderSystem.getDynamicUniforms().writeTransform(modelView);\n        GpuBufferSlice projection = RenderSystem.getProjectionMatrixBuffer();\n        GpuBufferSlice fog = RenderSystem.getShaderFog();\n        if (dynamicTransforms == null || projection == null || fog == null\n                || RenderSystem.getGlobalSettingsUniform() == null) {\n            throw new IllegalStateException("Minecraft world uniform buffers are unavailable for P3.10 replacement");\n        }\n        Minecraft minecraft = Minecraft.getInstance();\n        AbstractTexture blocksAtlas = minecraft.getTextureManager().getTexture(TextureAtlas.LOCATION_BLOCKS);\n        if (blocksAtlas == null || blocksAtlas.getTextureView() == null || blocksAtlas.getSampler() == null\n                || renderer.levelLightmap() == null) {\n            throw new IllegalStateException("Minecraft live atlas/lightmap is unavailable for P3.10 replacement");\n        }\n        GpuBufferSlice passthroughVertexSlice = arena.slice(passthroughVertexHandle);\n        GpuBufferSlice mergedVertexSlice = arena.slice(mergedVertexHandle);\n        GpuBufferSlice indexSlice = arena.slice(indexHandle);\n        if (cutout) {\n            encodeProductionClass(pass, passthroughCutoutPipeline, dynamicTransforms, projection, fog,\n                    blocksAtlas, renderer, passthroughVertexSlice, indexSlice,\n                    indirectCommands.buffer().slice(IndexedIndirectCommandBuffer.COMMAND_BYTES, IndexedIndirectCommandBuffer.COMMAND_BYTES));\n            encodeProductionClass(pass, mergedCutoutPipeline, dynamicTransforms, projection, fog,\n                    blocksAtlas, renderer, mergedVertexSlice, indexSlice,\n                    indirectCommands.buffer().slice(3L * IndexedIndirectCommandBuffer.COMMAND_BYTES, IndexedIndirectCommandBuffer.COMMAND_BYTES));\n            triangles += (drawableMesh.passthroughCutoutIndexCount() + drawableMesh.mergedCutoutIndexCount()) / 3L;\n        } else {\n            encodeProductionClass(pass, passthroughSolidPipeline, dynamicTransforms, projection, fog,\n                    blocksAtlas, renderer, passthroughVertexSlice, indexSlice,\n                    indirectCommands.buffer().slice(0L, IndexedIndirectCommandBuffer.COMMAND_BYTES));\n            encodeProductionClass(pass, mergedSolidPipeline, dynamicTransforms, projection, fog,\n                    blocksAtlas, renderer, mergedVertexSlice, indexSlice,\n                    indirectCommands.buffer().slice(2L * IndexedIndirectCommandBuffer.COMMAND_BYTES, IndexedIndirectCommandBuffer.COMMAND_BYTES));\n            triangles += (drawableMesh.passthroughSolidIndexCount() + drawableMesh.mergedSolidIndexCount()) / 3L;\n        }\n        drawSubmissions++;\n        indirectCalls += 2L;\n        resourceEpochChecks++;\n    }\n\n    private void encodeProductionClass(\n            RenderPass pass,\n            RenderPipeline pipeline,\n            GpuBufferSlice dynamicTransforms,\n            GpuBufferSlice projection,\n            GpuBufferSlice fog,\n            AbstractTexture blocksAtlas,\n            GameRenderer renderer,\n            GpuBufferSlice vertexSlice,\n            GpuBufferSlice indexSlice,\n            GpuBufferSlice commandSlice) {\n        pass.setPipeline(pipeline);\n        pass.setUniform("Globals", RenderSystem.getGlobalSettingsUniform());\n        pass.setUniform("Fog", fog);\n        pass.setUniform("DynamicTransforms", dynamicTransforms);\n        pass.setUniform("Projection", projection);\n        pass.bindTexture("Sampler0", blocksAtlas.getTextureView(), blocksAtlas.getSampler());\n        pass.bindTexture("Sampler2", renderer.levelLightmap(),\n                RenderSystem.getSamplerCache().getClampToEdge(FilterMode.LINEAR));\n        pass.setVertexBuffer(0, vertexSlice);\n        pass.setIndexBuffer(indexSlice.buffer(), IndexType.INT);\n        pass.drawIndexedIndirect(commandSlice, 1);\n    }\n\n'''
          if insert_anchor not in text: raise SystemExit('missing submitDraw insertion anchor')
          text = text.replace(insert_anchor, insert_anchor + addition, 1)
          p.write_text(text)

          # Scene lookup API for production claims.
          p = Path('src/client/java/dev/obsidian/render/terrain/AsyncMultiSectionSceneProbe.java')
          text = p.read_text()
          anchor = '    public State state() { return state; }\n'
          addition = '''    public WorkerBackedSectionLifecycleProbe productionReplacementProbe(int x, int y, int z) {\n        RenderSystem.assertOnRenderThread();\n        if (closed || hardFailure || state != State.LIVE) return null;\n        for (SceneRecord record : records) {\n            if (record.sectionX != x || record.sectionY != y || record.sectionZ != z\n                    || record.eligibility != Eligibility.ELIGIBLE || record.probe == null\n                    || !record.installObserved || record.probe.state() != WorkerBackedSectionLifecycleProbe.State.LIVE\n                    || record.probe.generation() != sceneGeneration\n                    || record.probe.differentialCorrectnessProof() == null\n                    || !record.probe.differentialCorrectnessProof().exact()) {\n                continue;\n            }\n            return record.probe;\n        }\n        return null;\n    }\n\n'''
          if anchor not in text: raise SystemExit('missing async state accessor anchor')
          p.write_text(text.replace(anchor, addition + anchor, 1))

          # FrameCoordinator owns the bounded plan and exposes the exact mixin bridge.
          p = Path('src/client/java/dev/obsidian/render/frame/FrameCoordinator.java')
          text = p.read_text()
          text = text.replace('import com.mojang.blaze3d.systems.RenderSystem;\n',
                              'import com.mojang.blaze3d.systems.RenderSystem;\nimport com.mojang.blaze3d.systems.RenderPass;\n')
          text = text.replace('import dev.obsidian.render.terrain.RenderMergeCandidates;\n',
                              'import dev.obsidian.render.terrain.RenderMergeCandidates;\nimport dev.obsidian.render.terrain.ProductionTerrainReplacementPlan;\n')
          text = text.replace('import net.minecraft.client.renderer.GameRenderer;\n',
                              'import net.minecraft.client.renderer.GameRenderer;\nimport net.minecraft.client.renderer.chunk.ChunkSectionLayer;\n')
          text = text.replace('    private final SectionMeshWorkerPool meshWorkers;\n',
                              '    private final SectionMeshWorkerPool meshWorkers;\n    private final ProductionTerrainReplacementPlan terrainReplacement = new ProductionTerrainReplacementPlan();\n', 1)
          text = text.replace('        if (sceneProbe != null) {\n            sceneProbe.beginFrame(frameIndex);',
                              '        if (terrainReplacement.hardFailure()) hardFailure = true;\n        if (sceneProbe != null) {\n            sceneProbe.beginFrame(frameIndex);', 1)
          anchor = '    public long frameIndex() { return frameIndex; }\n'
          addition = '''    public void beginProductionTerrainPreparation() {\n        RenderSystem.assertOnRenderThread();\n        if (closed) return;\n        terrainReplacement.beginPrepare(frameIndex);\n        if (terrainReplacement.hardFailure()) hardFailure = true;\n    }\n\n    public boolean tryClaimProductionTerrainReplacement(int x, int y, int z, ChunkSectionLayer layer) {\n        RenderSystem.assertOnRenderThread();\n        if (closed || hardFailure || sceneProbe == null) return false;\n        boolean claimed = terrainReplacement.tryClaim(sceneProbe, x, y, z, layer);\n        if (terrainReplacement.hardFailure()) hardFailure = true;\n        return claimed;\n    }\n\n    public void encodeProductionTerrainReplacements(RenderPass pass, GameRenderer renderer) {\n        RenderSystem.assertOnRenderThread();\n        if (closed || hardFailure) return;\n        terrainReplacement.encodeOpaque(pass, renderer);\n        if (terrainReplacement.hardFailure()) hardFailure = true;\n    }\n\n'''
          if anchor not in text: raise SystemExit('missing frameIndex accessor anchor')
          text = text.replace(anchor, addition + anchor, 1)
          text = text.replace('        closed = true;\n\n        AsyncMultiSectionSceneProbe probe = sceneProbe;',
                              '        closed = true;\n        terrainReplacement.close();\n        if (terrainReplacement.hardFailure()) hardFailure = true;\n\n        AsyncMultiSectionSceneProbe probe = sceneProbe;', 1)
          p.write_text(text)

          # Bootstrap bridge for mixins.
          p = Path('src/client/java/dev/obsidian/bootstrap/ObsidianBootstrap.java')
          text = p.read_text()
          text = text.replace('import dev.obsidian.render.frame.FrameCoordinator;\n',
                              'import dev.obsidian.render.frame.FrameCoordinator;\nimport com.mojang.blaze3d.systems.RenderPass;\nimport net.minecraft.client.renderer.chunk.ChunkSectionLayer;\n')
          anchor = '    public static void onFrameEnd() {\n        FrameCoordinator coordinator = frameCoordinator;\n        if (coordinator != null) coordinator.endFrame();\n    }\n\n'
          addition = '''    public static void beginProductionTerrainPreparation() {\n        FrameCoordinator coordinator = frameCoordinator;\n        if (coordinator != null) coordinator.beginProductionTerrainPreparation();\n    }\n\n    public static boolean tryClaimProductionTerrainReplacement(\n            int sectionX, int sectionY, int sectionZ, ChunkSectionLayer layer) {\n        FrameCoordinator coordinator = frameCoordinator;\n        return coordinator != null\n                && coordinator.tryClaimProductionTerrainReplacement(sectionX, sectionY, sectionZ, layer);\n    }\n\n    public static void encodeProductionTerrainReplacements(RenderPass pass, GameRenderer renderer) {\n        FrameCoordinator coordinator = frameCoordinator;\n        if (coordinator != null) coordinator.encodeProductionTerrainReplacements(pass, renderer);\n    }\n\n'''
          if anchor not in text: raise SystemExit('missing bootstrap frame-end anchor')
          text = text.replace(anchor, anchor + addition, 1)
          old_banner = 'Obsidian Phase 3 dev15 P3.8 meshing benchmark instrumentation armed.'
          text = text.replace(old_banner, 'Obsidian Phase 3 dev24 P3.10 production opaque/cutout replacement canary armed.', 1)
          p.write_text(text)

          # Mixin registration.
          p = Path('src/main/resources/obsidian.mixins.json')
          text = p.read_text()
          text = text.replace('    "ClientLevelMixin",\n', '    "ClientLevelMixin",\n    "ChunkSectionsToRenderMixin",\n')
          text = text.replace('    "LevelExtractorMixin",\n', '    "LevelExtractorMixin",\n    "LevelRendererTerrainReplacementMixin",\n')
          p.write_text(text)

          # Remove one-shot probe/helper workflows from the implementation tree.
          Path('.github/workflows/p3-10-render-seam-probe.yml').unlink(missing_ok=True)
          Path('.github/workflows/p3-10-dev24-source-patch.yml').unlink(missing_ok=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[no-release] Implement P3.10 dev24 production replacement canary'
          git push origin HEAD:phase3/p3.10-production-terrain-replacement
