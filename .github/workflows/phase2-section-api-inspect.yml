name: Phase 2 Section API Inspect

on:
  push:
    branches: [phase2/real-section-reference]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect exact Minecraft 26.2 section/world/render-state APIs
        shell: bash
        run: |
          set -euo pipefail
          gradle compileClientJava --stacktrace
          mkdir -p phase2-section-inspect
          out=phase2-section-inspect/api.txt
          : > "$out"
          root="$HOME/.gradle/caches/fabric-loom/26.2"
          client=$(find "$root" -type f -name 'minecraft-client*.jar' | head -n 1)
          common=$(find "$root" -type f -name 'minecraft-common*.jar' | head -n 1)
          cp="$client:$common"
          echo "client=$client" >> "$out"
          echo "common=$common" >> "$out"
          echo >> "$out"
          classes=(
            'net.minecraft.client.Minecraft'
            'net.minecraft.client.multiplayer.ClientLevel'
            'net.minecraft.client.multiplayer.ClientChunkCache'
            'net.minecraft.world.level.chunk.ChunkAccess'
            'net.minecraft.world.level.chunk.LevelChunk'
            'net.minecraft.world.level.chunk.LevelChunkSection'
            'net.minecraft.world.level.LevelHeightAccessor'
            'net.minecraft.world.level.BlockGetter'
            'net.minecraft.world.level.Level'
            'net.minecraft.world.level.block.Block'
            'net.minecraft.world.level.block.Blocks'
            'net.minecraft.world.level.block.state.BlockState'
            'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase'
            'net.minecraft.world.level.block.RenderShape'
            'net.minecraft.world.level.material.FluidState'
            'net.minecraft.core.BlockPos$MutableBlockPos'
            'net.minecraft.core.SectionPos'
            'net.minecraft.world.level.ChunkPos'
            'net.minecraft.world.level.chunk.status.ChunkStatus'
          )
          for cls in "${classes[@]}"; do
            echo "===== $cls public/constants =====" >> "$out"
            javap -classpath "$cp" -public -constants "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
            echo "===== $cls bytecode/private =====" >> "$out"
            javap -classpath "$cp" -c -p "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done
          echo '===== selected method references =====' >> "$out"
          for cls in "${classes[@]}"; do
            echo "--- $cls ---" >> "$out"
            javap -classpath "$cp" -p "$cls" 2>&1 | grep -n -Ei 'getChunk|hasChunk|getSection|getSections|sectionIndex|getBlockState|isAir|canOcclude|isSolidRender|getRenderShape|hasBlockEntity|hasOffsetFunction|getFluidState|isEmpty|player|level|getMinY|getMaxY|getMinSection|getMaxSection|isOutsideBuildHeight|getBlock|getId|stateById|blockPosition| set\(' >> "$out" || true
          done
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-section-api-inspect
          path: phase2-section-inspect/api.txt
          if-no-files-found: error
