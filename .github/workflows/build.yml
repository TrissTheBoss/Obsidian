name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Java 25 / Gradle 9.5.1
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/libs/Obsidian-*.jar

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-release]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          if [ -z "$VERSION" ]; then
            echo 'mod_version is missing from gradle.properties' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: obsidian-${{ github.sha }}
          path: release

      - name: Validate release files and create checksums
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          JAR="release/Obsidian-${VERSION}.jar"
          SOURCES="release/Obsidian-${VERSION}-sources.jar"
          test -f "$JAR"
          test -f "$SOURCES"
          cd release
          sha256sum "Obsidian-${VERSION}.jar" "Obsidian-${VERSION}-sources.jar" > SHA256SUMS

      - name: Publish release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v${VERSION}"
          JAR="release/Obsidian-${VERSION}.jar"
          SOURCES="release/Obsidian-${VERSION}-sources.jar"
          NOTES="docs/releases/${TAG}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the existing release untouched."
            exit 0
          fi

          if [ -f "$NOTES" ]; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Obsidian ${VERSION}" \
              --notes-file "$NOTES" \
              "$JAR" "$SOURCES" release/SHA256SUMS
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Obsidian ${VERSION}" \
              --generate-notes \
              "$JAR" "$SOURCES" release/SHA256SUMS
          fi
