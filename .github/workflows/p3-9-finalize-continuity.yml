name: P3.9 final continuity

on:
  push:
    branches: [phase3/partial-remeshing]
    paths:
      - '.github/workflows/p3-9-finalize-continuity.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase3/partial-remeshing
      - name: Update roadmap and attempt index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          log = Path('ai/ATTEMPT_LOG.md')
          text = log.read_text(encoding='utf-8')
          marker = '## A-0188 - dev23 final P3.9 runtime decision'
          if marker not in text:
              text += '''\n\n---\n\n## A-0188 - dev23 final P3.9 runtime decision\n\n**Date:** 2026-08-30\n**Result:** `FINAL DECISION SUCCESS / FIXED FOUR-SLICE P3.9 REJECTED-DEFERRED`. Dev23 routed 5 deterministic unselected-truth changes to mandatory full-section fallback and closed 32/32 exact localized episodes with zero correctness/unselected/determinism failures. Volume passed: one-slice 19, two-slice 13, coalesced 3. CPU P50/P95 24/256 permille and projected upload P50 300 permille passed, but projected upload P95 was **807 permille**, missing the frozen `<=800` A-0159 threshold by 7 permille. Metadata 96 bytes, identities 4, inflation 0/0. No threshold/oracle/slice retuning or rerun is permitted. P3.9 is formally REJECTED/DEFERRED and the next active target is production opaque/cutout terrain replacement using the proven full-section async greedy path. PR #53 closes without merge.\n**Evidence:** `ai/attempts/A-0188-phase3-p3.9-dev23-final-runtime-reject-defer.md`.\n'''
              log.write_text(text, encoding='utf-8')

          roadmap = Path('ai/MASTER_ROADMAP.md')
          r = roadmap.read_text(encoding='utf-8')
          r = r.replace('#### P3.9 — Partial remeshing — ACTIVE / EXPERIMENTAL',
                        '#### P3.9 — Partial remeshing — REJECTED / DEFERRED')
          old = '''A-0159 freezes the first experiment as `0.3.0-phase3-dev16`: a **shadow-only fixed four-Y-slice decomposition** over the existing full-section production control. Exact block-local dirty provenance is required; unavailable/global lifecycle causes fall back to full-section. Selected slices are expanded by the proven one-block Y dependency, shadow output must pass permanent source/reference differential checks and prove unselected slices unchanged, and matched per-generation CPU/work/upload ratios are judged against pre-frozen thresholds. Dev16 changes no production GPU geometry/install path. Partial GPU patching is a later P3.9 slice only if this experiment proves sufficient benefit while keeping fixed metadata <=1 KiB/section and bounded geometry inflation.\n\nPhase 3 exits only when the greedy mesher is default for supported terrain, permanent differential correctness passes, the worker system remains bounded/cancellation-safe, hot paths avoid routine allocation and throughput supports large-scale scene testing.'''
          new = '''A-0159 froze the experiment as a **shadow-only fixed four-Y-slice decomposition** over the existing full-section production control. After dev16-dev23 diagnostics/corrections, A-0188 closes the strategy at full safe volume: 32/32 completed localized episodes were exact with zero correctness/unselected/determinism failures, one-slice 19, two-slice 13, coalesced 3, CPU P50/P95 24/256 permille, projected upload P50 300 permille, metadata 96 bytes and inflation 0/0. The final projected-upload P95 was **807 permille**, above the pre-frozen `<=800` threshold. A-0159 forbids post-measurement retuning, so the fixed four-slice strategy is formally **REJECTED/DEFERRED**. Partial GPU patching was never implemented and is not a Phase 3 prerequisite.\n\n#### P3.10 — Production opaque/cutout terrain replacement — ACTIVE\n\nReplace the supported vanilla/Fabric opaque/cutout terrain draw path with Obsidian's already-proven full-section asynchronous greedy output. Freeze a new immutable contract before source changes. Preserve the permanent P3.7 reference/differential oracle, exact supported render semantics, conservative passthrough for unsupported/generalized geometry, bounded worker/upload/arena lifetime, generation-safe stale rejection, Vulkan-only vendor-neutral ownership boundaries, and targeted visual/lifecycle/reload/recenter evidence. The production gate must prove Obsidian replaces the corresponding terrain draw path rather than merely rendering a comparison copy.\n\nPhase 3 exits only when the greedy mesher is default for supported terrain, permanent differential correctness passes, the worker system remains bounded/cancellation-safe, hot paths avoid routine allocation and throughput supports large-scale scene testing.'''
          if old in r:
              r = r.replace(old, new)
          elif '#### P3.10 — Production opaque/cutout terrain replacement — ACTIVE' not in r:
              anchor = 'Phase 3 exits only when the greedy mesher is default for supported terrain'
              r = r.replace(anchor, '#### P3.10 — Production opaque/cutout terrain replacement — ACTIVE\n\nReplace the supported vanilla/Fabric opaque/cutout terrain draw path with Obsidian\'s already-proven full-section asynchronous greedy output. Freeze a new immutable contract before source changes.\n\n' + anchor)
          revision = '''\n### 2026-08-30 — P3.9 terminal decision and production replacement activation\n\n- A-0188 closed dev23 with 32/32 exact safe localized episodes and zero completed-episode correctness failures;\n- the A-0186 safety fallback routed 5 deterministic unselected-truth changes to authoritative full-section fallback;\n- all frozen volume/CPU/complexity requirements passed, but projected-upload P95 was 807 permille against the frozen <=800 threshold;\n- no threshold retuning or additional four-slice rerun is permitted; P3.9 is REJECTED/DEFERRED;\n- production opaque/cutout terrain replacement is now the active Phase 3 target; partial GPU patching is not a prerequisite.\n'''
          if '### 2026-08-30 — P3.9 terminal decision and production replacement activation' not in r:
              anchor = '## 16. Roadmap revision log\n'
              r = r.replace(anchor, anchor + revision + '\n')
          roadmap.write_text(r, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/p3-9-finalize-continuity.yml
          git add ai/ATTEMPT_LOG.md ai/MASTER_ROADMAP.md
          git commit -m '[no-release] Finalize P3.9 continuity and activate production terrain replacement'
          git push origin HEAD:phase3/partial-remeshing
