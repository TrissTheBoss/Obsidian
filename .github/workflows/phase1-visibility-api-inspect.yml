name: Phase 1 Visibility API Inspect

on:
  push:
    branches: [phase1/visibility-compaction]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect exact Minecraft 26.2 visibility/indirect APIs
        shell: bash
        run: |
          set -euo pipefail
          gradle compileClientJava --stacktrace
          mkdir -p phase1-visibility-inspect
          out=phase1-visibility-inspect/api.txt
          : > "$out"
          jarfile=$(find "$HOME/.gradle/caches/fabric-loom/26.2" -type f -name 'minecraft-client*.jar' | head -n 1)
          echo "jar=$jarfile" >> "$out"
          classes=(
            'com.mojang.blaze3d.systems.RenderPass'
            'com.mojang.blaze3d.systems.DeviceFeatures'
            'com.mojang.blaze3d.vulkan.VulkanRenderPass'
            'com.mojang.blaze3d.vulkan.VulkanCommandEncoder'
            'com.mojang.blaze3d.vulkan.VulkanDevice'
          )
          for cls in "${classes[@]}"; do
            echo "===== $cls public/constants =====" >> "$out"
            javap -classpath "$jarfile" -public -constants "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
            echo "===== $cls bytecode =====" >> "$out"
            javap -classpath "$jarfile" -c -p "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done
          echo '===== indirect-count references across selected bytecode =====' >> "$out"
          for cls in "${classes[@]}"; do
            javap -classpath "$jarfile" -c -p "$cls" 2>&1 | grep -n -Ei 'drawIndexedIndirectCount|drawIndirectCount|IndirectCount|vkCmdDrawIndexedIndirect' || true
          done
          echo '===== jar class-name references =====' >> "$out"
          jar tf "$jarfile" | grep -Ei 'IndirectCount|DrawCount|Visibility|Frustum' | sort || true
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-visibility-api-inspect
          path: phase1-visibility-inspect/api.txt
          if-no-files-found: error
