name: P3.8 A-0158 Continuity Sync

on:
  push:
    branches:
      - phase3/meshing-benchmarks
    paths:
      - '.github/workflows/p3-8-a0158-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P3.8 branch
        uses: actions/checkout@v4
        with:
          ref: phase3/meshing-benchmarks
          fetch-depth: 0
      - name: Synchronize A-0158 runtime state
        run: python tools/p3_8_a0158_sync.py
      - name: Remove temporary helper files
        run: rm tools/p3_8_a0158_sync.py .github/workflows/p3-8-a0158-sync.yml
      - name: Commit synchronized state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/CURRENT_STATE.md ai/ATTEMPT_LOG.md tools/p3_8_a0158_sync.py .github/workflows/p3-8-a0158-sync.yml
          git commit -m '[no-release] Synchronize P3.8 runtime promotion state'
          git push origin HEAD:phase3/meshing-benchmarks
