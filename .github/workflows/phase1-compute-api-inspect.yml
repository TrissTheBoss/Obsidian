name: Phase 1 Compute API Inspect

on:
  push:
    branches: [phase1/compute-indirect]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect exact Minecraft 26.2 compute APIs
        shell: bash
        run: |
          set -euo pipefail
          gradle compileClientJava --stacktrace
          mkdir -p phase1-compute-inspect
          out=phase1-compute-inspect/api.txt
          : > "$out"
          jarfile=$(find "$HOME/.gradle/caches/fabric-loom/26.2" -type f -name 'minecraft-client*.jar' | head -n 1)
          echo "jar=$jarfile" >> "$out"
          echo '===== Compute/storage/barrier related classes =====' >> "$out"
          jar tf "$jarfile" | grep -Ei 'Compute|Storage|Barrier|ResourceAccess|ShaderType|Pipeline' | sort >> "$out" || true
          echo >> "$out"
          classes=(
            'com.mojang.blaze3d.systems.CommandEncoder'
            'com.mojang.blaze3d.systems.ComputePass'
            'com.mojang.blaze3d.systems.GpuDevice'
            'com.mojang.blaze3d.systems.DeviceFeatures'
            'com.mojang.blaze3d.buffers.GpuBuffer'
            'com.mojang.blaze3d.buffers.GpuBufferSlice'
            'com.mojang.blaze3d.pipeline.ComputePipeline'
            'com.mojang.blaze3d.pipeline.CompiledComputePipeline'
            'com.mojang.blaze3d.shaders.ShaderSource'
            'com.mojang.blaze3d.shaders.ShaderType'
            'com.mojang.blaze3d.vulkan.VulkanComputePass'
            'com.mojang.blaze3d.vulkan.VulkanCommandEncoder'
            'com.mojang.blaze3d.vulkan.VulkanDevice'
          )
          for cls in "${classes[@]}"; do
            echo "===== $cls public/constants =====" >> "$out"
            javap -classpath "$jarfile" -public -constants "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
            echo "===== $cls bytecode =====" >> "$out"
            javap -classpath "$jarfile" -c -p "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done
          echo '===== Vulkan compute/barrier references =====' >> "$out"
          javap -classpath "$jarfile" -c -p com.mojang.blaze3d.vulkan.VulkanCommandEncoder 2>&1 | grep -n -E 'Compute|Barrier|vkCmdDispatch|PipelineBarrier|INDIRECT|SHADER' >> "$out" || true
          javap -classpath "$jarfile" -c -p com.mojang.blaze3d.vulkan.VulkanComputePass 2>&1 | grep -n -E 'dispatch|setStorage|setPipeline|Barrier|vkCmdDispatch' >> "$out" || true
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-compute-api-inspect
          path: phase1-compute-inspect/api.txt
          if-no-files-found: error
