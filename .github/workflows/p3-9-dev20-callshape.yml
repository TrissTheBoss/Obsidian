name: P3.9 dev20 exact call-shape probe

on:
  push:
    branches: [phase3/partial-remeshing]
    paths:
      - '.github/workflows/p3-9-dev20-callshape.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase3/partial-remeshing
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Resolve exact Minecraft 26.2 client and inspect dirty call shape
        shell: bash
        run: |
          set -euo pipefail
          gradle compileClientJava --no-daemon
          JAR="$(find "$HOME/.gradle/caches" -type f \( -name '*minecraft*26.2*client*.jar' -o -name '*minecraft-26.2-client*.jar' \) | head -n 1)"
          if [ -z "$JAR" ]; then
            JAR="$(find "$HOME/.gradle/caches" -type f -name '*.jar' | while read -r f; do if jar tf "$f" 2>/dev/null | grep -q '^net/minecraft/client/multiplayer/ClientLevel.class$'; then echo "$f"; break; fi; done)"
          fi
          test -n "$JAR"
          echo "MINECRAFT_CLIENT_JAR=$JAR"
          javap -classpath "$JAR" -c -p net.minecraft.client.multiplayer.ClientLevel > /tmp/clientlevel.txt
          javap -classpath "$JAR" -c -p net.minecraft.client.renderer.extract.LevelExtractor > /tmp/levelextractor.txt
          echo '=== ClientLevel setBlocksDirty and section dirty delegates ==='
          grep -n -A 80 -E '^  public void setBlocksDirty|^  public void setSectionDirtyWithNeighbors|^  public void setSectionRangeDirty' /tmp/clientlevel.txt || true
          echo '=== LevelExtractor setBlockDirty ==='
          grep -n -A 180 -E '^  public void setBlockDirty|^  private void setBlockDirty' /tmp/levelextractor.txt || true
          echo '=== LevelExtractor setSectionDirty methods ==='
          grep -n -A 140 -E '^  public void setSectionDirty|^  private void setSectionDirty' /tmp/levelextractor.txt || true
          echo '=== LevelExtractor section range / neighbor dirty ==='
          grep -n -A 160 -E '^  public void setSectionDirtyWithNeighbors|^  public void setSectionRangeDirty|^  private void setSectionRangeDirty' /tmp/levelextractor.txt || true
          echo '=== Calls into setSectionDirty from LevelExtractor ==='
          grep -n -C 12 -E 'Method setSectionDirty:|Method setSectionDirtyWithNeighbors:' /tmp/levelextractor.txt || true
