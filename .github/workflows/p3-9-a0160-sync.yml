name: P3.9 A-0160 Continuity Sync

on:
  push:
    branches: [ phase3/partial-remeshing ]
    paths:
      - tools/p3_9_a0160_sync.py
      - .github/workflows/p3-9-a0160-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P3.9 branch
        uses: actions/checkout@v4
        with:
          ref: phase3/partial-remeshing
          fetch-depth: 0
      - name: Synchronize A-0160 package state
        run: python tools/p3_9_a0160_sync.py
      - name: Remove temporary helper files
        run: rm tools/p3_9_a0160_sync.py .github/workflows/p3-9-a0160-sync.yml
      - name: Commit synchronized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[no-release] Synchronize P3.9 dev16 package handoff"
          git push origin HEAD:phase3/partial-remeshing
