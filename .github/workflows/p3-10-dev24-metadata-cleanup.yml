name: P3.10 dev24 telemetry cleanup

on:
  push:
    branches: [phase3/p3.10-production-terrain-replacement]
    paths:
      - '.github/workflows/p3-10-dev24-metadata-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase3/p3.10-production-terrain-replacement
      - name: Correct dev24 telemetry semantics and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/client/java/dev/obsidian/render/terrain/WorkerBackedSectionLifecycleProbe.java')
          t = p.read_text()
          old = '''            usefulSubmissions++;\n            drawSubmissions++;\n            indirectCalls += INDIRECT_COMMAND_COUNT;\n            triangles += drawableMesh.indexBytes() / Integer.BYTES / 3L;\n            emittedMergedQuads += drawableMesh.mergedQuadCount();'''
          new = '''            usefulSubmissions++;\n            emittedMergedQuads += drawableMesh.mergedQuadCount();'''
          if old not in t: raise SystemExit('missing install counter anchor')
          t = t.replace(old, new, 1)
          t = t.replace('"obsidian_phase3_dev11_passthrough_solid"', '"obsidian_phase3_dev24_passthrough_solid"')
          t = t.replace('"obsidian_phase3_dev11_passthrough_cutout"', '"obsidian_phase3_dev24_passthrough_cutout"')
          t = t.replace('"obsidian_phase3_dev11_merged_solid"', '"obsidian_phase3_dev24_merged_solid"')
          t = t.replace('"obsidian_phase3_dev11_merged_cutout"', '"obsidian_phase3_dev24_merged_cutout"')
          old_log = '''"Phase 3 dev11 hybrid worker result installed on frame {0}: generation={1}, eventSequence={2}, priority={3}, section=({4},{5},{6}), oracleFingerprint={7}, hybridFingerprint={8}, sourceQuads={9}, suppressedSourceQuads={10}, passthroughQuads={11}, mergedQuads={12}, hybridQuads={13}, facesSaved={14}, sourceUploadBytes={15}, hybridUploadBytes={16}, synchronousSceneMeshBuilds=0, repeatAwareGreedyGpuEmission=true, renderThreadGpuOwnershipPreserved=true."'''
          new_log = '''"Phase 3 dev24 production worker result installed on frame {0}: generation={1}, eventSequence={2}, priority={3}, section=({4},{5},{6}), oracleFingerprint={7}, hybridFingerprint={8}, sourceQuads={9}, suppressedSourceQuads={10}, passthroughQuads={11}, mergedQuads={12}, hybridQuads={13}, facesSaved={14}, sourceUploadBytes={15}, hybridUploadBytes={16}, synchronousSceneMeshBuilds=0, repeatAwareGreedyGpuEmission=true, productionCoordinatesExact=true, productionExactColor=true, postWorldComparisonDrawDisabled=true, renderThreadGpuOwnershipPreserved=true."'''
          if old_log not in t: raise SystemExit('missing install log anchor')
          t = t.replace(old_log, new_log, 1)
          p.write_text(t)

          p = Path('src/client/java/dev/obsidian/bootstrap/ObsidianBootstrap.java')
          t = p.read_text()
          start = '"Obsidian Phase 3 dev24 P3.10 production opaque/cutout replacement canary armed.'
          idx = t.find(start)
          if idx < 0: raise SystemExit('missing bootstrap dev24 banner')
          end = t.find('");', idx)
          if end < 0: raise SystemExit('missing bootstrap banner end')
          replacement = '''"Obsidian Phase 3 dev24 P3.10 production opaque/cutout replacement canary armed. Exact Minecraft 26.2 bytecode authorizes per-section SOLID/CUTOUT suppression at prepareChunkRenders and same-OPAQUE-RenderPass replacement before later world depth consumers. Only LIVE generation/resource-current P3.7-exact full-section records may suppress vanilla; every unavailable or ambiguous unit stays vanilla. Dev24 removes the old comparison-only 1/512 face offset and 75% RGB tint, uses exact frozen positions/color/light/material/UV truth, disables post-world comparison copies, retains bounded workers/staging/arena and completion-gated lifetime, expands no native Vulkan graphics ownership, and does not implement partial remeshing or partial GPU patching; workerWorldReadsAfterCapture=0."'''
          t = t[:idx] + replacement + t[end:]
          p.write_text(t)

          p = Path('src/client/java/dev/obsidian/render/frame/FrameCoordinator.java')
          t = p.read_text()
          t = t.replace('"Phase 3 dev15 P3.8 frame coordinator active. contextSlots="',
                        '"Phase 3 dev24 P3.10 frame coordinator active. contextSlots="', 1)
          t = t.replace('; all proven P3.2-P3.7 correctness and dev11 repeat-aware greedy GPU emission remain armed unchanged. P3.8 dev15 adds only bounded production-worker benchmark telemetry: fixed primitive samples, workload identity, GC deltas and stage timing composition. Dev15 changes no geometry, shader, pipeline, vertex/index format, atlas/lightmap semantics, scheduling policy, rebuild granularity or native graphics behavior.',
                        '; inherited P3.2-P3.8 correctness/benchmark evidence remains armed. Dev24 adds only the bounded production SOLID/CUTOUT suppression/replacement plan at the exact Minecraft 26.2 public-Blaze3D OPAQUE seam; unsupported/unavailable terrain remains vanilla and native graphics ownership is unchanged.', 1)
          p.write_text(t)

          Path('.github/workflows/p3-10-dev24-metadata-cleanup.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[no-release] Correct dev24 production telemetry semantics'
          git push origin HEAD:phase3/p3.10-production-terrain-replacement
