name: Phase 1 Device Arena API Inspect

on:
  push:
    branches: [phase1/device-arena]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect exact Minecraft 26.2 arena APIs
        shell: bash
        run: |
          set -euo pipefail
          gradle compileClientJava --stacktrace
          mkdir -p phase1-device-arena-inspect
          out=phase1-device-arena-inspect/api.txt
          : > "$out"
          jarfile=$(find "$HOME/.gradle/caches/fabric-loom/26.2" -type f -name 'minecraft-client*.jar' | head -n 1)
          classes=(
            'com.mojang.blaze3d.buffers.GpuBuffer'
            'com.mojang.blaze3d.buffers.GpuBufferSlice'
            'com.mojang.blaze3d.systems.CommandEncoder'
            'com.mojang.blaze3d.systems.GpuDevice'
            'com.mojang.blaze3d.buffers.GpuFence'
          )
          for cls in "${classes[@]}"; do
            echo "===== $cls public/constants =====" >> "$out"
            javap -classpath "$jarfile" -public -constants "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done
          echo '===== Vulkan buffer-related classes =====' >> "$out"
          jar tf "$jarfile" | grep -E 'com/mojang/blaze3d/.*vulkan.*(Buffer|Device).*class' | sort >> "$out" || true
          echo >> "$out"
          for cls in \
            'com.mojang.blaze3d.vulkan.VulkanGpuBuffer' \
            'com.mojang.blaze3d.vulkan.VulkanGpuBuffer$Direct' \
            'com.mojang.blaze3d.vulkan.VulkanDevice'; do
            echo "===== $cls bytecode =====" >> "$out"
            javap -classpath "$jarfile" -c -p "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-device-arena-api-inspect
          path: phase1-device-arena-inspect/api.txt
          if-no-files-found: error
