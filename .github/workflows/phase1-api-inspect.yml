name: Phase 1 API Inspect

on:
  push:
    branches: [phase1/frame-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Resolve Minecraft 26.2 and inspect frame/GPU APIs
        shell: bash
        run: |
          set -euo pipefail
          gradle compileClientJava --stacktrace
          mkdir -p phase1-inspect
          out=phase1-inspect/api.txt
          : > "$out"

          jarfile=$(find "$HOME/.gradle/caches/fabric-loom/26.2" -type f -name 'minecraft-client*.jar' | head -n 1)
          echo "JAR=$jarfile" >> "$out"
          echo >> "$out"

          classes=(
            net.minecraft.client.Minecraft
            net.minecraft.client.renderer.GameRenderer
            com.mojang.blaze3d.systems.RenderSystem
            com.mojang.blaze3d.systems.GpuDevice
            com.mojang.blaze3d.systems.GpuQueryPool
            com.mojang.blaze3d.systems.CommandEncoder
          )

          for cls in "${classes[@]}"; do
            echo "===== $cls =====" >> "$out"
            javap -classpath "$jarfile" -public "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done

          echo "===== query/sync/system class inventory =====" >> "$out"
          jar tf "$jarfile" | grep '^com/mojang/blaze3d/systems/.*\(Query\|Fence\|Command\|Device\|Backend\).*\.class$' | sort >> "$out" || true

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-api-inspect
          path: phase1-inspect/api.txt
          if-no-files-found: error
