name: Dev14 Apply Source Patch

on:
  push:
    branches: [phase3/differential-correctness]
    paths:
      - '.github/workflows/dev14-apply.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: phase3/differential-correctness
          fetch-depth: 0

      - name: Apply dev14 source patch
        run: |
          base64 -d tools/dev14.patch.gz.b64 | gzip -d > /tmp/dev14.patch
          git apply --check /tmp/dev14.patch
          git apply /tmp/dev14.patch

      - name: Remove temporary patch machinery
        run: |
          rm -f tools/dev14.patch.gz.b64
          rm -f .github/workflows/dev14-apply.yml

      - name: Commit dev14 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m '[no-release] Implement P3.7 dev14 differential correctness'
          git push origin HEAD:phase3/differential-correctness
