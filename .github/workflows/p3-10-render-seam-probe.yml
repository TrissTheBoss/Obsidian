name: P3.10 exact Minecraft render seam probe

on:
  push:
    branches: [phase3/p3.10-production-terrain-replacement]
    paths:
      - '.github/workflows/p3-10-render-seam-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Resolve exact Minecraft 26.2 client and inspect terrain seam
        shell: bash
        run: |
          set -euo pipefail
          gradle classes --stacktrace >/tmp/gradle-resolve.log 2>&1
          JAR="$(find "$HOME/.gradle/caches/fabric-loom/26.2" -name 'minecraft-client-only.jar' -type f | head -n 1)"
          test -n "$JAR"
          echo "EXACT_MC_JAR=$JAR"
          javap -classpath "$JAR" -c -p net.minecraft.client.renderer.LevelRenderer > /tmp/LevelRenderer.bytecode.txt
          for C in \
            net.minecraft.client.renderer.chunk.ChunkSectionLayer \
            net.minecraft.client.renderer.chunk.ChunkSectionLayerGroup \
            net.minecraft.client.renderer.chunk.ChunkSectionsToRender \
            net.minecraft.client.renderer.chunk.SectionMesh \
            'net.minecraft.client.renderer.chunk.SectionMesh$SectionDraw' \
            'net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection'; do
            N="$(printf '%s' "$C" | tr '$.' '__')"
            javap -classpath "$JAR" -p "$C" > "/tmp/${N}.sig.txt"
            javap -classpath "$JAR" -c -p "$C" > "/tmp/${N}.bytecode.txt"
          done
          echo '=== prepareChunkRenders exact body ==='
          sed -n '923,1200p' /tmp/LevelRenderer.bytecode.txt
          echo '=== addMainPass exact runnable body ==='
          sed -n '2414,2540p' /tmp/LevelRenderer.bytecode.txt
          echo '=== ChunkSectionLayer ==='
          cat /tmp/net_minecraft_client_renderer_chunk_ChunkSectionLayer.sig.txt
          cat /tmp/net_minecraft_client_renderer_chunk_ChunkSectionLayer.bytecode.txt
          echo '=== ChunkSectionLayerGroup ==='
          cat /tmp/net_minecraft_client_renderer_chunk_ChunkSectionLayerGroup.sig.txt
          cat /tmp/net_minecraft_client_renderer_chunk_ChunkSectionLayerGroup.bytecode.txt
          echo '=== ChunkSectionsToRender ==='
          cat /tmp/net_minecraft_client_renderer_chunk_ChunkSectionsToRender.sig.txt
          cat /tmp/net_minecraft_client_renderer_chunk_ChunkSectionsToRender.bytecode.txt
          echo '=== SectionMesh / SectionDraw signatures ==='
          cat /tmp/net_minecraft_client_renderer_chunk_SectionMesh.sig.txt
          cat /tmp/net_minecraft_client_renderer_chunk_SectionMesh_SectionDraw.sig.txt
          echo '=== RenderSection signatures ==='
          cat /tmp/net_minecraft_client_renderer_chunk_SectionRenderDispatcher_RenderSection.sig.txt
      - name: Upload exact probe text
        uses: actions/upload-artifact@v4
        with:
          name: p3-10-render-seam-probe-${{ github.sha }}
          if-no-files-found: error
          path: /tmp/*.txt
