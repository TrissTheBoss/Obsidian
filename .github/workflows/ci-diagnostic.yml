name: CI Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Run full build and capture result
        shell: bash
        run: |
          mkdir -p docs
          set +e
          gradle build --stacktrace > ci-build.log 2>&1
          code=$?
          {
            echo "Obsidian temporary full-build diagnostic"
            echo "commit=$GITHUB_SHA"
            echo "build_exit_code=$code"
            echo
            echo "--- build tail ---"
            tail -n 180 ci-build.log
          } > docs/ci-diagnostic.txt
          exit 0

      - name: Publish diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/ci-diagnostic.txt
          git commit -m "chore: record Phase 0 CI result [no-release]" || exit 0
          git push
