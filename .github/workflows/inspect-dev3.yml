name: Inspect Phase 2 Dev3 APIs

on:
  push:
    branches: [phase2/material-texture-identity-inspect]

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect Minecraft 26.2 material and texture APIs
        shell: bash
        run: |
          set -euo pipefail
          gradle classes --stacktrace
          cat > /tmp/obsidian-inspect.init.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p == rootProject) {
                tasks.register('printClientCompileClasspath') {
                  doLast { println sourceSets.client.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator) }
                }
              }
            }
          }
          EOF
          gradle -q -I /tmp/obsidian-inspect.init.gradle printClientCompileClasspath | tail -n 1 > /tmp/cp
          CP="$(cat /tmp/cp)"
          mkdir -p inspection
          tr ':' '\n' < /tmp/cp > inspection/classpath.txt
          : > inspection/matched-classes.txt
          while IFS= read -r JAR; do
            if [ -f "$JAR" ] && [[ "$JAR" == *.jar ]]; then
              jar tf "$JAR" 2>/dev/null | grep -E '^(net/minecraft|com/mojang/blaze3d)/.*(BlockStateModel|BakedQuad|TextureAtlasSprite|SpriteContents|ModelManager|BlockColors|BlockTint|Material|RenderType|RenderPipelines|TextureAtlas|TextureManager|AbstractTexture|TextureSetup|DefaultVertexFormat|VertexFormat).*\.class$' >> inspection/matched-classes.txt || true
            fi
          done < inspection/classpath.txt
          sort -u inspection/matched-classes.txt | head -n 220 > inspection/matched-classes-bounded.txt
          sed -E 's#/#.#g; s#\.class$##' inspection/matched-classes-bounded.txt > inspection/class-names.txt
          : > inspection/public-api.txt
          while IFS= read -r CLASS; do
            echo "=== $CLASS ===" >> inspection/public-api.txt
            javap -classpath "$CP" -public "$CLASS" >> inspection/public-api.txt 2>&1 || true
            echo >> inspection/public-api.txt
          done < inspection/class-names.txt
          for CLASS in \
            net.minecraft.client.renderer.block.model.BakedQuad \
            net.minecraft.client.renderer.texture.TextureAtlasSprite \
            net.minecraft.client.renderer.texture.TextureAtlas \
            net.minecraft.client.renderer.texture.TextureManager \
            net.minecraft.client.color.block.BlockColors \
            net.minecraft.client.renderer.RenderType \
            net.minecraft.client.renderer.RenderPipelines \
            com.mojang.blaze3d.vertex.DefaultVertexFormat; do
            SAFE="$(echo "$CLASS" | tr '.' '_')"
            javap -classpath "$CP" -c -p "$CLASS" > "inspection/${SAFE}-bytecode.txt" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-dev3-api-inspection-${{ github.sha }}
          if-no-files-found: error
          path: inspection/
