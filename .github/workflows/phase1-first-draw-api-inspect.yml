name: Phase 1 First Draw API Inspect

on:
  push:
    branches: [phase1/first-draw]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect exact Minecraft 26.2 graphics APIs
        shell: bash
        run: |
          set -euo pipefail
          gradle compileClientJava --stacktrace
          mkdir -p phase1-first-draw-inspect
          out=phase1-first-draw-inspect/api.txt
          : > "$out"
          jarfile=$(find "$HOME/.gradle/caches/fabric-loom/26.2" -type f -name 'minecraft-client*.jar' | head -n 1)
          echo "jar=$jarfile" >> "$out"
          echo '===== Graphics-related classes =====' >> "$out"
          jar tf "$jarfile" | grep -E 'com/mojang/blaze3d/(pipeline|systems|textures|vertex)/.*(RenderPipeline|RenderPass|GpuTexture|TextureFormat|VertexFormat|VertexBuffer|Shader|Pipeline).*class' | sort >> "$out" || true
          echo >> "$out"
          classes=(
            'com.mojang.blaze3d.pipeline.RenderPipeline'
            'com.mojang.blaze3d.pipeline.RenderPipeline$Builder'
            'com.mojang.blaze3d.pipeline.RenderPipelines'
            'com.mojang.blaze3d.systems.GpuDevice'
            'com.mojang.blaze3d.systems.CommandEncoder'
            'com.mojang.blaze3d.systems.RenderPass'
            'com.mojang.blaze3d.textures.GpuTexture'
            'com.mojang.blaze3d.textures.GpuTextureView'
            'com.mojang.blaze3d.textures.TextureFormat'
            'com.mojang.blaze3d.buffers.GpuBuffer'
            'com.mojang.blaze3d.buffers.GpuBufferSlice'
            'com.mojang.blaze3d.vertex.VertexFormat'
            'com.mojang.blaze3d.vertex.VertexFormat$Mode'
            'com.mojang.blaze3d.vertex.DefaultVertexFormat'
          )
          for cls in "${classes[@]}"; do
            echo "===== $cls public/constants =====" >> "$out"
            javap -classpath "$jarfile" -public -constants "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
            echo "===== $cls bytecode =====" >> "$out"
            javap -classpath "$jarfile" -c -p "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done
          echo '===== Shader/resource references =====' >> "$out"
          jar tf "$jarfile" | grep -E 'assets/minecraft/shaders/.*\.(vsh|fsh|glsl)$' | head -n 80 >> "$out" || true
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-first-draw-api-inspect
          path: phase1-first-draw-inspect/api.txt
          if-no-files-found: error
