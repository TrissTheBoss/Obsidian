name: Dev13 Apply Source Patch

on:
  push:
    branches: [phase3/t-junction-policy]
    paths:
      - '.github/workflows/dev13-apply.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: phase3/t-junction-policy
          fetch-depth: 0

      - name: Apply exact dev13 patch
        run: python3 tools/dev13_apply_patch.py

      - name: Remove temporary patch machinery
        run: |
          rm -f tools/dev13_apply_patch.py
          rm -f .github/workflows/dev13-apply.yml

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m '[no-release] Implement P3.6 dev13 T-junction evidence'
          git push origin HEAD:phase3/t-junction-policy
