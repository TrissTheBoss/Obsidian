name: P3.9 dev18 runtime continuity sync

on:
  push:
    branches: [phase3/partial-remeshing]
    paths:
      - '.github/workflows/p3-9-dev18-runtime-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase3/partial-remeshing
          fetch-depth: 0

      - name: Synchronize continuity
        shell: python
        run: |
          from pathlib import Path

          current = Path('ai/CURRENT_STATE.md')
          text = current.read_text(encoding='utf-8')
          anchor = "- Dev18 result completion requires exact episode id plus final widened slice mask, preventing an older narrow worker result from closing a widened pending episode; request self-tests prove mask union, edit accounting, fingerprint preservation, all-four rejection and overflow rejection.\n"
          addition = anchor + "- Dev18 reference runtime: **A-0167 PARTIAL**. The A-0165 pending-coalescing correction is validated: pending fallbacks fell to `0` and one coalesced episode completed with zero correctness/unselected/determinism failures. A-0159 remains open only because valid evidence volume was `14/32`, one-slice `10/16`, two-slice `4/8`; the run produced `74` X/Z halo/boundary and `30` provenance fallbacks. CPU P50/P95 `174/739` and projected upload P50 `51` permille pass, while upload P95 `1000` is not decision-grade at only 14 samples. **Repeat the exact dev18 binary with controlled interior X/Z edits; do not build dev19.**\n"
          if text.count(anchor) != 1:
              raise RuntimeError(f'CURRENT_STATE anchor count={text.count(anchor)}')
          current.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          log = Path('ai/ATTEMPT_LOG.md')
          log_text = log.read_text(encoding='utf-8')
          entry = """

## A-0167 — Phase 3 P3.9 dev18 reference runtime — PARTIAL

- Date: 2026-08-29
- Exact dev18 runtime loaded and both P3.9 windows armed.
- Correctness remains closed: `14/14` exact, zero correctness/unselected/determinism failures, no retained first failure; inherited P3.7/P3.8/lifetime gates green and exit code 0.
- A-0165 correction validated: pending-episode fallbacks `0` (dev17 `9`) and coalesced completed episodes `1` (dev17 `0`).
- Evidence volume still below frozen A-0159: completed `14/32`, one-slice `10/16`, two-slice `4/8`.
- Fallbacks `121`: global `7`, provenance `30`, multi-section `0`, halo/XZ-boundary `74`, all-slices `0`, pending `0`, not-LIVE `10`; accounting coherent.
- Benefit: selected-cell P50 `250`; CPU P50/P95 `174/739`; projected upload P50/P95 `51/1000`; inflation mean/max `0/3` permille.
- Interpretation: P50 upload proves the projected path is not intrinsically full-size. At 14 retained samples nearest-rank P95 is the maximum sample, so the P95 miss cannot reject the four-slice strategy before the frozen >=32 episode minimum.
- Decision: **no code or threshold change; repeat the exact dev18 binary with section-local X/Z interior edits until >=32 localized, >=16 one-slice and >=8 two-slice samples. Do not build dev19.**
- Full immutable record: `ai/attempts/A-0167-phase3-p3.9-dev18-reference-runtime-partial.md`.
"""
          if '## A-0167 — Phase 3 P3.9 dev18 reference runtime — PARTIAL' in log_text:
              raise RuntimeError('A-0167 already present in ATTEMPT_LOG')
          log.write_text(log_text.rstrip() + entry + '\n', encoding='utf-8')

      - name: Remove temporary helper
        run: rm .github/workflows/p3-9-dev18-runtime-sync.yml

      - name: Commit clean continuity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[no-release] Synchronize P3.9 dev18 runtime partial'
          git push origin HEAD:phase3/partial-remeshing
