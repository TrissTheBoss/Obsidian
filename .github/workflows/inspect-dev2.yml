name: Inspect Phase 2 Dev2 APIs

on:
  push:
    branches: [phase2/drawable-real-section-inspect]
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect final buffer binding contracts
        shell: bash
        run: |
          set -euo pipefail
          gradle classes --stacktrace
          cat > /tmp/obsidian-inspect.init.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p == rootProject) {
                tasks.register('printClientCompileClasspath') {
                  doLast { println sourceSets.client.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator) }
                }
              }
            }
          }
          EOF
          gradle -q -I /tmp/obsidian-inspect.init.gradle printClientCompileClasspath | tail -n 1 > /tmp/cp
          CP="$(cat /tmp/cp)"
          mkdir -p inspection
          for CLASS in \
            com.mojang.blaze3d.buffers.GpuBuffer \
            com.mojang.blaze3d.buffers.GpuBufferSlice \
            com.mojang.blaze3d.vertex.DefaultVertexFormat \
            com.mojang.blaze3d.PrimitiveTopology; do
            echo "=== $CLASS ==="
            javap -classpath "$CP" -public "$CLASS" || true
          done | tee inspection/public-api.txt
          javap -classpath "$CP" -c -p com.mojang.blaze3d.vertex.DefaultVertexFormat > inspection/default-vertex-format-bytecode.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-dev2-final-buffer-inspection-${{ github.sha }}
          if-no-files-found: error
          path: inspection/
