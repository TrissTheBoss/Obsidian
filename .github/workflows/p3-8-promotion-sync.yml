name: P3.7 Promotion Continuity Sync

on:
  push:
    branches:
      - phase3/differential-correctness
    paths:
      - .github/workflows/p3-8-promotion-sync.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: phase3/differential-correctness
          fetch-depth: 0

      - name: Synchronize promotion continuity
        run: python tools/p3_8_promotion_sync.py

      - name: Remove temporary helper files
        run: rm -f tools/p3_8_promotion_sync.py .github/workflows/p3-8-promotion-sync.yml

      - name: Commit synchronized evidence state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[no-release] Synchronize P3.7 promotion evidence'
          git push origin HEAD:phase3/differential-correctness
