name: Phase 1 Indirect API Inspect

on:
  push:
    branches: [phase1/arena-indirect-draw]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect exact Minecraft 26.2 indirect-draw APIs
        shell: bash
        run: |
          set -euo pipefail
          gradle compileClientJava --stacktrace
          mkdir -p phase1-indirect-inspect
          out=phase1-indirect-inspect/api.txt
          : > "$out"
          jarfile=$(find "$HOME/.gradle/caches/fabric-loom/26.2" -type f -name 'minecraft-client*.jar' | head -n 1)
          echo "jar=$jarfile" >> "$out"
          echo '===== Indirect-related classes/constants =====' >> "$out"
          jar tf "$jarfile" | grep -Ei 'Indirect|MultiDraw|DrawIndexed' | sort >> "$out" || true
          echo >> "$out"
          classes=(
            'com.mojang.blaze3d.systems.RenderPass'
            'com.mojang.blaze3d.systems.CommandEncoder'
            'com.mojang.blaze3d.systems.GpuDevice'
            'com.mojang.blaze3d.systems.DeviceFeatures'
            'com.mojang.blaze3d.systems.DeviceLimits'
            'com.mojang.blaze3d.buffers.GpuBuffer'
            'com.mojang.blaze3d.buffers.GpuBufferSlice'
            'com.mojang.blaze3d.vulkan.VulkanRenderPass'
            'com.mojang.blaze3d.vulkan.VulkanCommandEncoder'
            'com.mojang.blaze3d.vulkan.VulkanDevice'
            'com.mojang.blaze3d.vulkan.VulkanGpuBuffer'
          )
          for cls in "${classes[@]}"; do
            echo "===== $cls public/constants =====" >> "$out"
            javap -classpath "$jarfile" -public -constants "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
            echo "===== $cls bytecode =====" >> "$out"
            javap -classpath "$jarfile" -c -p "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done
          echo '===== Vulkan draw call references =====' >> "$out"
          javap -classpath "$jarfile" -c -p com.mojang.blaze3d.vulkan.VulkanRenderPass 2>&1 | grep -n -E 'vkCmdDraw|Indirect|MultiDraw|draw' >> "$out" || true
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-indirect-api-inspect
          path: phase1-indirect-inspect/api.txt
          if-no-files-found: error
