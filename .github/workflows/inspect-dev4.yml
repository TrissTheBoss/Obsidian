name: Inspect Phase 2 Dev4 APIs

on:
  push:
    branches: [phase2/lighting-ao-correctness-inspect]
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect exact final dev4 contracts
        shell: bash
        run: |
          set -euo pipefail
          gradle classes --stacktrace
          cat > /tmp/obsidian-inspect.init.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p == rootProject) {
                tasks.register('printClientCompileClasspath') {
                  doLast { println sourceSets.client.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator) }
                }
              }
            }
          }
          EOF
          gradle -q -I /tmp/obsidian-inspect.init.gradle printClientCompileClasspath | tail -n 1 > /tmp/cp
          CP="$(cat /tmp/cp)"
          mkdir -p inspection
          cat > inspection/target-classes.txt <<'EOF'
          net.minecraft.world.level.BlockAndLightGetter
          net.minecraft.world.level.BlockGetter
          net.minecraft.client.multiplayer.ClientLevel
          net.minecraft.client.renderer.block.BlockAndTintGetter
          net.minecraft.client.renderer.chunk.ChunkSectionsToRender
          net.minecraft.client.renderer.chunk.ChunkSectionLayerGroup
          net.minecraft.client.renderer.LevelRenderer
          net.minecraft.client.renderer.GameRenderer
          net.minecraft.client.renderer.Lightmap
          com.mojang.blaze3d.systems.SamplerCache
          com.mojang.blaze3d.textures.GpuSampler
          com.mojang.blaze3d.textures.AddressMode
          com.mojang.blaze3d.textures.FilterMode
          EOF
          : > inspection/public-api.txt
          : > inspection/bytecode.txt
          while IFS= read -r CLASS; do
            echo "=== $CLASS ===" >> inspection/public-api.txt
            javap -classpath "$CP" -public "$CLASS" >> inspection/public-api.txt 2>&1 || true
            echo >> inspection/public-api.txt
            echo "=== $CLASS ===" >> inspection/bytecode.txt
            javap -classpath "$CP" -c -p "$CLASS" >> inspection/bytecode.txt 2>&1 || true
            echo >> inspection/bytecode.txt
          done < inspection/target-classes.txt
          grep -n -E 'renderGroup|Sampler2|lightmap|levelLightmap|createSampler|chunkLayerSampler|bindTexture|getSampler|getLightEngine|getBlockState|getFluidState|getMinY|getHeight|cardinalLighting|FilterMode|AddressMode' inspection/bytecode.txt > inspection/key-grep.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-dev4-final-inspection-${{ github.sha }}
          if-no-files-found: error
          path: inspection/