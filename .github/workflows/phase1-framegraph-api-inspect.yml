name: Phase 1 Frame Graph API Inspect

on:
  push:
    branches: [phase1/frame-graph-profiler]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect exact Minecraft 26.2 frame graph APIs
        shell: bash
        run: |
          set -euo pipefail
          gradle compileClientJava --stacktrace
          mkdir -p phase1-framegraph-inspect
          out=phase1-framegraph-inspect/api.txt
          : > "$out"
          jarfile=$(find "$HOME/.gradle/caches/fabric-loom/26.2" -type f -name 'minecraft-client*.jar' | head -n 1)
          echo '===== Query-related classes =====' >> "$out"
          jar tf "$jarfile" | grep -E 'com/mojang/blaze3d/.*(Query|Timestamp).*class' | sort >> "$out" || true
          echo >> "$out"
          classes=(
            'com.mojang.blaze3d.systems.GpuDevice'
            'com.mojang.blaze3d.systems.CommandEncoder'
            'com.mojang.blaze3d.buffers.GpuQueryPool'
            'com.mojang.blaze3d.buffers.GpuFence'
          )
          for cls in "${classes[@]}"; do
            echo "===== $cls public/constants =====" >> "$out"
            javap -classpath "$jarfile" -public -constants "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
            echo "===== $cls bytecode =====" >> "$out"
            javap -classpath "$jarfile" -c -p "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done
          echo '===== Vulkan query classes bytecode =====' >> "$out"
          for cls in $(jar tf "$jarfile" | grep -E '^com/mojang/blaze3d/vulkan/.*(Query|Timestamp).*class$' | sed 's#/#.#g;s#.class$##'); do
            echo "===== $cls =====" >> "$out"
            javap -classpath "$jarfile" -c -p "$cls" >> "$out" 2>&1 || true
            echo >> "$out"
          done
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-framegraph-api-inspect
          path: phase1-framegraph-inspect/api.txt
          if-no-files-found: error
