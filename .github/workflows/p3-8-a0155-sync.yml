name: P3.8 A-0155 Continuity Sync

on:
  push:
    branches:
      - phase3/meshing-benchmarks
    paths:
      - .github/workflows/p3-8-a0155-sync.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout P3.8 branch
        uses: actions/checkout@v4
        with:
          ref: phase3/meshing-benchmarks
          fetch-depth: 0
      - name: Synchronize A-0155 continuity
        run: python tools/p3_8_a0155_sync.py
      - name: Remove temporary helper files
        run: rm -f tools/p3_8_a0155_sync.py .github/workflows/p3-8-a0155-sync.yml
      - name: Commit synchronized state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No continuity changes produced'
            exit 1
          fi
          git commit -m '[no-release] Synchronize P3.8 dev15 implementation state'
          git push origin HEAD:phase3/meshing-benchmarks
