name: Publish Preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH PREVIEW to publish the selected ref as a GitHub prerelease'
        required: true
        type: string

permissions:
  contents: write

jobs:
  preview:
    name: Build and publish preview prerelease
    if: github.event.inputs.confirmation == 'PUBLISH PREVIEW'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Resolve and validate preview version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          if [[ -z "$VERSION" ]]; then
            echo 'mod_version is missing from gradle.properties' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ (dev|alpha|beta|rc|preview) ]]; then
            echo "Refusing preview publication: '$VERSION' does not contain a prerelease marker." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build exact selected ref
        run: gradle build --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION='\${{ steps.version.outputs.version }}'
          mkdir -p release
          cp "build/libs/Obsidian-$VERSION.jar" release/
          cp "build/libs/Obsidian-$VERSION-sources.jar" release/
          cd release
          sha256sum "Obsidian-$VERSION.jar" "Obsidian-$VERSION-sources.jar" > SHA256SUMS

      - name: Publish immutable preview prerelease
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='\${{ steps.version.outputs.version }}'
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. Preview tags are immutable; bump mod_version for a different binary."
            exit 0
          fi

          cat > release/PREVIEW_NOTES.md <<EOF
          > [!WARNING]
          > **PREVIEW / TEST BUILD - NOT PRODUCTION READY unless this release explicitly says otherwise.**

          This build is published for active Obsidian runtime testing.

          - Version: $VERSION
          - Exact source commit: $GITHUB_SHA
          - Minecraft: 26.2
          - Fabric Loader baseline: 0.19.3
          - Java: 25
          - Renderer backend: Vulkan only

          Read the active PR and ai/CURRENT_STATE.md for the exact test contract, known limitations, and visual expectations.

          SHA-256 hashes are attached in SHA256SUMS.
          EOF

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Obsidian $VERSION - Preview" \
            --prerelease \
            --notes-file release/PREVIEW_NOTES.md \
            "release/Obsidian-$VERSION.jar" \
            "release/Obsidian-$VERSION-sources.jar" \
            release/SHA256SUMS

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Preview publication"
            echo
            echo "- Version: \${{ steps.version.outputs.version }}"
            echo "- Source: $GITHUB_SHA"
            echo "- Channel: GitHub Prerelease"
          } >> "$GITHUB_STEP_SUMMARY"
