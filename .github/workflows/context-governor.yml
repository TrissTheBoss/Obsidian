name: Context Governor

on:
  push:
    branches: [main]
    paths:
      - 'ai/context/**'
      - 'ai/skills/context-governor/**'
      - 'ai/README.md'
      - 'ai/OPERATING_MANUAL.md'
      - 'ai/DECISIONS.md'
      - 'AGENTS.md'
      - '.github/workflows/context-governor.yml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai/context/**'
      - 'ai/skills/context-governor/**'
      - 'ai/README.md'
      - 'ai/OPERATING_MANUAL.md'
      - 'ai/DECISIONS.md'
      - 'AGENTS.md'
      - '.github/workflows/context-governor.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate context, minimization, and Actions evidence policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Run Context Governor tests
        run: python3 ai/skills/context-governor/scripts/test_context_governor.py

      - name: Validate active context capsule
        run: python3 ai/skills/context-governor/scripts/context_governor.py validate-checkpoint ai/context/ACTIVE_CONTEXT.json
