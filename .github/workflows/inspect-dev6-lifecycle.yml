name: Inspect Phase 2 Dev6 Lifecycle APIs

on:
  push:
    branches: [phase2/section-lifecycle-rebuild-inspect]
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect exact dev6 lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          gradle classes --stacktrace
          cat > /tmp/obsidian-inspect.init.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p == rootProject) {
                tasks.register('printClientCompileClasspath') {
                  doLast { println sourceSets.client.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator) }
                }
              }
            }
          }
          EOF
          gradle -q -I /tmp/obsidian-inspect.init.gradle printClientCompileClasspath | tail -n 1 > /tmp/cp
          CP="$(cat /tmp/cp)"
          mkdir -p inspection-dev6

          cat > inspection-dev6/classes.txt <<'EOF'
          net.minecraft.client.multiplayer.ClientLevel
          net.minecraft.client.multiplayer.ClientChunkCache
          net.minecraft.client.multiplayer.ClientPacketListener
          net.minecraft.client.renderer.LevelRenderer
          net.minecraft.client.renderer.chunk.SectionRenderDispatcher
          net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection
          net.minecraft.client.renderer.chunk.SectionCompiler
          net.minecraft.world.level.lighting.LevelLightEngine
          net.minecraft.world.level.lighting.LayerLightEventListener
          net.minecraft.client.resources.model.ModelManager
          net.minecraft.client.Minecraft
          net.minecraft.server.packs.resources.ReloadableResourceManager
          net.minecraft.server.packs.resources.PreparableReloadListener
          net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientChunkEvents
          net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientWorldEvents
          net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents
          net.fabricmc.fabric.api.resource.ResourceManagerHelper
          net.fabricmc.fabric.api.resource.SimpleSynchronousResourceReloadListener
          EOF

          : > inspection-dev6/api.txt
          : > inspection-dev6/code.txt
          while IFS= read -r CLASS; do
            echo "=== $CLASS ===" >> inspection-dev6/api.txt
            javap -classpath "$CP" -public "$CLASS" >> inspection-dev6/api.txt 2>&1 || true
            echo >> inspection-dev6/api.txt
            echo "=== $CLASS ===" >> inspection-dev6/code.txt
            javap -classpath "$CP" -c -p "$CLASS" >> inspection-dev6/code.txt 2>&1 || true
            echo >> inspection-dev6/code.txt
          done < inspection-dev6/classes.txt

          tr ':' '\n' < /tmp/cp | while IFS= read -r JAR; do
            if [ -f "$JAR" ] && [[ "$JAR" == *.jar ]]; then
              jar tf "$JAR" 2>/dev/null | grep -E '(^net/minecraft/client/.*(Chunk|Section|LevelRenderer|RenderSection|Light|Reload|ModelManager).*\.class$)|(^net/minecraft/world/level/lighting/.*\.class$)|(^net/fabricmc/fabric/api/client/.*(Chunk|World|Block|Light).*Event.*\.class$)|(^net/fabricmc/fabric/api/resource/.*Reload.*\.class$)' || true
            fi
          done | sort -u > inspection-dev6/discovered-names.txt

          grep -n -E 'setBlock|setBlocksDirty|setSectionDirty|setSectionDirtyWithNeighbors|blockChanged|onBlock|light|Light|dirty|Dirty|invalidate|unload|drop|replaceWithPacketData|replaceBiomes|updateViewCenter|updateViewRadius|onChunk|ChunkEvents|WorldEvents|disconnect|clearLevel|setLevel|reload|Reload|resource|Resource|generation|version|section|Section|RenderSection' inspection-dev6/code.txt > inspection-dev6/key-grep.txt || true

          # Also inventory exact Fabric client lifecycle event class names from the resolved classpath.
          grep -E '^net/fabricmc/fabric/api/client/.*Event.*\.class$|^net/fabricmc/fabric/api/resource/.*Reload.*\.class$' inspection-dev6/discovered-names.txt > inspection-dev6/fabric-event-names.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-dev6-lifecycle-inspection-${{ github.sha }}
          if-no-files-found: error
          path: inspection-dev6/
