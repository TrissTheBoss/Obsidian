name: P3.9 dev17 continuity sync

on:
  push:
    branches: [phase3/partial-remeshing]
    paths:
      - '.github/workflows/p3-9-dev17-continuity.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase3/partial-remeshing
          fetch-depth: 0

      - name: Synchronize continuity
        run: |
          python3 tools/p3_9_dev17_continuity.py
          sed -i 's/[[:space:]]\+$//' ai/ATTEMPT_LOG.md

      - name: Remove temporary helper files
        run: |
          rm tools/p3_9_dev17_continuity.py
          rm .github/workflows/p3-9-dev17-continuity.yml

      - name: Commit clean continuity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[no-release] Synchronize P3.9 dev17 package handoff'
          git push origin HEAD:phase3/partial-remeshing
