name: Apply Dev6 Lifecycle Sources

on:
  push:
    branches: [phase2/section-lifecycle-rebuild]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[dev6-apply]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/section-lifecycle-rebuild
          fetch-depth: 0
      - name: Apply exact prepared lifecycle sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/client/java/dev/obsidian/render/terrain src/client/java/dev/obsidian/render/frame
          echo '' | base64 -d | gzip -d > src/client/java/dev/obsidian/render/terrain/RealSectionLifecycleProbe.java
          echo '' | base64 -d | gzip -d > src/client/java/dev/obsidian/render/frame/FrameCoordinator.java
          rm .github/workflows/dev6-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/client/java/dev/obsidian/render/terrain/RealSectionLifecycleProbe.java src/client/java/dev/obsidian/render/frame/FrameCoordinator.java .github/workflows/dev6-apply.yml
          git commit -m '[dev6-apply] Implement generation-safe lifecycle probe'
          git push origin HEAD:phase2/section-lifecycle-rebuild
