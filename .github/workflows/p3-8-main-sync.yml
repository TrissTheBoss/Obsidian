name: P3.8 Main Continuity Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p3-8-main-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize P3.8 completion state
        run: python tools/p3_8_main_sync.py
      - name: Remove temporary helper files
        run: rm tools/p3_8_main_sync.py .github/workflows/p3-8-main-sync.yml
      - name: Commit synchronized state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/CURRENT_STATE.md ai/MASTER_ROADMAP.md tools/p3_8_main_sync.py .github/workflows/p3-8-main-sync.yml
          git commit -m '[no-release] Synchronize P3.8 complete and P3.9 active'
          git push origin HEAD:main
