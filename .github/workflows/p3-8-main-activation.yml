name: P3.8 Main Activation Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p3-8-main-activation.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize P3.8 activation
        run: python tools/p3_8_main_activation.py

      - name: Remove temporary helper files
        run: rm -f tools/p3_8_main_activation.py .github/workflows/p3-8-main-activation.yml

      - name: Commit synchronized main state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[no-release] Synchronize P3.7 completion and P3.8 activation'
          git push origin HEAD:main
