name: P3.8 Contract Continuity Sync

on:
  push:
    branches:
      - phase3/meshing-benchmarks
    paths:
      - .github/workflows/p3-8-contract-sync.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout P3.8 branch
        uses: actions/checkout@v4
        with:
          ref: phase3/meshing-benchmarks
          fetch-depth: 0

      - name: Synchronize contract continuity
        run: python tools/p3_8_contract_sync.py

      - name: Remove temporary helper files
        run: rm -f tools/p3_8_contract_sync.py .github/workflows/p3-8-contract-sync.yml

      - name: Commit synchronized P3.8 state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[no-release] Synchronize P3.8 benchmark contract'
          git push origin HEAD:phase3/meshing-benchmarks
