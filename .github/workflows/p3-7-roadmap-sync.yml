name: P3.7 Roadmap Sync

on:
  push:
    branches: [phase3/t-junction-policy]
    paths:
      - '.github/workflows/p3-7-roadmap-sync.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: phase3/t-junction-policy
          fetch-depth: 0

      - name: Apply roadmap synchronization
        run: python3 tools/p3_7_roadmap_sync.py

      - name: Remove temporary synchronization machinery
        run: |
          rm -f tools/p3_7_roadmap_sync.py
          rm -f .github/workflows/p3-7-roadmap-sync.yml

      - name: Commit synchronized roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m '[no-release] Synchronize P3.6 complete and P3.7 active'
          git push origin HEAD:phase3/t-junction-policy
